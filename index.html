<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaPlan – Farm Irrigation Planner</title>
  <meta name="description" content="AquaPlan tells farmers when to irrigate and how much water to apply, using live weather and evapotranspiration data.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Apply a saved light/dark choice before the page paints (avoids a flash of the wrong theme). -->
  <script>try { const t = localStorage.getItem('aquaplan-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <!-- Leaflet: map for picking a field's location (tiles from OpenStreetMap) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <div class="site-header__left">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu" data-menu-toggle>
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
        </button>
        <a class="brand" href="#/home"><img class="brand__logo" src="assets/logo-dark.png" alt="AquaPlan home" width="150" height="40"></a>
      </div>
      <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode" data-theme-toggle>
        <span class="theme-switch__knob"></span>
        <span class="theme-switch__icon theme-switch__icon--sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="theme-switch__icon theme-switch__icon--moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>
      </button>
      <nav id="site-menu" class="menu" aria-label="Main" hidden>
        <a href="#/home" data-nav="home">Home</a>
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/purpose" data-nav="purpose">Our purpose</a>
        <a href="#/how-it-works" data-nav="how">How it works</a>
        <a href="#/about" data-nav="about">About us</a>
        <a href="#/contact" data-nav="contact">Contact us</a>
      </nav>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <noscript>AquaPlan needs JavaScript to run.</noscript>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="site-footer__brand" href="#/home"><img src="assets/logo-dark.png" alt="AquaPlan home" width="120" height="32"></a>

      <nav class="footer-col footer-col--pages" aria-label="Pages">
        <h2 class="footer-col__title">Pages</h2>
        <ul>
          <li><a href="#/home" data-nav="home">Home</a></li>
          <li><a href="#/dashboard" data-nav="dashboard">Dashboard</a></li>
          <li><a href="#/purpose" data-nav="purpose">Our purpose</a></li>
          <li><a href="#/how-it-works" data-nav="how">How it works</a></li>
          <li><a href="#/about" data-nav="about">About us</a></li>
          <li><a href="#/contact" data-nav="contact">Contact us</a></li>
        </ul>
      </nav>

      <div class="footer-col">
        <h2 class="footer-col__title">Credits</h2>
        <ul>
          <li>Weather data: Open-Meteo</li>
          <li>INFO 251 Web Development II</li>
          <li>American University of Phnom Penh</li>
        </ul>
      </div>
    </div>
  </footer>
</body>
</html>
